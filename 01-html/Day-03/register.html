<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Developer Registration Form</title>
    </head>
    <body>

        <h1>Developer Registration Form</h1>
        <div class="container">
            <h2>Personal Information</h2>
            <form action="" method="post">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required><br>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required><br>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phonenumber" required><br>
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required><br>
            
            <h2>Account Information</h2>
            
                <label for="username">User Name</label>
                <input type="text" id="username" name="username" required><br>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required><br>
            
            <h2>Professional Information</h2>
            
                <label>Experience</label>
                <input type="radio" id="0-1" name="experience" value="0-1 years"> 
                <label for="0-1">0-1 years</label>
                <input type="radio" id="1-3" name="experience" value="1-3 years"> 
                <label for="1-3">1-3 years</label>
                <input type="radio" id="3-5" name="experience" value="3-5 years"> 
                <label for="3-5">3-5 years</label>
                <input type="radio" id="5+" name="experience" value="5+ years"> 
                <label for="5+">5+ years</label><br>

                <label for="role">Role</label>
                <select id="role" name="role">
                    <option value="frontend">Frontend Developer</option>
                    <option value="backend">Backend Developer</option>
                    <option value="fullstack">Full Stack Developer</option>
                </select><br>
                <label>Skills</label>
                <input type="checkbox" id="html" name="skills" value="HTML">
                <label for="html" >HTML</label>
                <input type="checkbox" id="css" name="skills" value="CSS">
                <label for="css">CSS</label>
                <input type="checkbox" id="js" name="skills" value="JavaScript"> 
                <label for="js">JavaScript</label>
        
            <h2>Additional Information</h2>
            
                <label for="portfolio">Portfolio Link</label>
                <input type="url" id="portfolio" name="portfolio"><br>
                <label for="about_your_self">About Yourself</label>
                <textarea id="about_your_self" name="about_your_self" rows="4" cols="50"></textarea><br>
            
            <h2>Agreement</h2>
            
                <input type="checkbox" id="agreement" name="agreement" required>
                <label for="agreement">I agree to the terms and conditions</label><br>
                <button type="submit">Submit</button>
                <button type="reset">Reset</button>
            </form>

        </div>

    </body>
</html>
